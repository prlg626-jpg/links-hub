name: Hub items processor

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process:
    if: github.event.issue.user.login == github.repository_owner && (contains(github.event.issue.labels.*.name, 'hub-add') || contains(github.event.issue.labels.*.name, 'hub-delete') || contains(github.event.issue.body, '### action'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update items.json
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const body = event.issue?.body || '';

          function pick(key) {
            const re = new RegExp(`###\\s+${key}\\s*\\n([\\s\\S]*?)(?=\\n\\n###|\\s*$)`, 'i');
            const m = body.match(re);
            return m ? m[1].trim() : '';
          }

          function firstUrl(value) {
            const m = String(value || '').match(/https?:\\/\\/[^\\s)]+/i);
            return m ? m[0].replace(/[>,.;]+$/, '') : '';
          }

          const action = pick('action');
          if (!action) throw new Error('Missing action');

          const file = 'items.json';
          const raw = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '{"items": []}';
          const data = JSON.parse(raw);
          if (!Array.isArray(data.items)) data.items = [];

          const now = new Date();
          const yyyy = now.getUTCFullYear();
          const mm = String(now.getUTCMonth() + 1).padStart(2, '0');
          const dd = String(now.getUTCDate()).padStart(2, '0');
          const date = `${yyyy}-${mm}-${dd}`;

          if (action === 'add-link') {
            const title = pick('title') || 'Sin título';
            const url = firstUrl(pick('url'));
            const category = pick('category') || 'General';
            const note = pick('note') || '';

            if (!url) throw new Error('Missing URL for add-link');
            const id = `link-${yyyy}${mm}${dd}-${Math.random().toString(16).slice(2,8)}`;
            data.items.unshift({ id, type: 'link', title, url, category, note, date });
          } else if (action === 'add-pdf') {
            const title = pick('title') || 'PDF';
            const url = firstUrl(pick('url'));
            const category = pick('category') || 'PDF';
            const note = pick('note') || '';
            const bucket_key = pick('bucket_key') || '';

            if (!url) throw new Error('Missing PDF attachment URL for add-pdf');
            const id = `pdf-${yyyy}${mm}${dd}-${Math.random().toString(16).slice(2,8)}`;
            data.items.unshift({ id, type: 'pdf', title, url, category, note, date, bucket_key });
          } else if (action === 'delete-item') {
            const id = pick('id');
            if (!id) throw new Error('Missing id for delete-item');
            const before = data.items.length;
            data.items = data.items.filter(x => x.id !== id);
            if (data.items.length === before) throw new Error(`Item not found: ${id}`);
          } else if (action === 'edit-item') {
            const id = pick('id');
            if (!id) throw new Error('Missing id for edit-item');
            const index = data.items.findIndex(x => x.id === id);
            if (index < 0) throw new Error(`Item not found: ${id}`);

            const current = data.items[index];
            const title = pick('title') || current.title || 'Sin título';
            const url = firstUrl(pick('url')) || current.url || '';
            const category = pick('category') || current.category || 'General';
            const note = pick('note');

            data.items[index] = {
              ...current,
              title,
              url,
              category,
              note,
              date: current.date || date
            };
          } else {
            throw new Error(`Unsupported action: ${action}`);
          }

          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n', 'utf8');
          NODE

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "hub-bot"
          git config user.email "hub-bot@users.noreply.github.com"
          git add items.json
          git commit -m "Update hub items from issue #${{ github.event.issue.number }}"
          git push

      - name: Close issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
